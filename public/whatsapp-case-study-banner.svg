<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
<title id="t">Case Study: WhatsApp Campaign Manager</title><desc id="d">The campaign app sits inside Vantage Circle next to the employee database and sends WhatsApp messages straight to phones. No data is exported.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B2E21"/><stop offset="1" stop-color="#10402E"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/></filter><style>text{font-family:'Geist','Inter','Segoe UI',system-ui,sans-serif}.kick{font-size:15px;font-weight:700;fill:#0B2E21;letter-spacing:2px}.title{font-size:46px;font-weight:800;fill:#F2FBF6;letter-spacing:-1px}.sub{font-size:21px;fill:#A7C9BA}.hl{fill:#5EE89A;font-weight:600}.lbl{font-size:14px;font-weight:700;fill:#5EE89A;letter-spacing:1.5px}.cap{font-size:13px;font-weight:600;fill:#DDF3E8}.no{font-size:13px;font-weight:600;fill:#FF8A8A}</style></defs>
<rect width="1280" height="400" fill="url(#bg)"/><circle cx="1160" cy="20" r="200" fill="#25D366" opacity="0.07"/>
<rect x="64" y="92" width="132" height="32" rx="16" fill="#5EE89A"/><text x="130" y="113" text-anchor="middle" class="kick">CASE STUDY</text><text x="64" y="190" class="title">WhatsApp</text><text x="64" y="242" class="title">Campaign Manager</text><text x="66" y="288" class="sub">Reaching 2M employees on WhatsApp,</text><text x="66" y="318" class="sub"><tspan class="hl">without exporting any client data.</tspan></text>
<rect x="610" y="56" width="380" height="288" rx="24" fill="#fff" fill-opacity="0.04" stroke="#5EE89A" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="8 8"/><text x="634" y="88" class="lbl">🔒 VANTAGE CIRCLE</text>
