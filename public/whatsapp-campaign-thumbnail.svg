<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0b1716" />
      <stop offset="100%" stop-color="#06120e" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="waGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#128C7E" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGradient)" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="680" cy="100" r="160" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="120" cy="350" r="140" fill="#25D366" opacity="0.08" filter="url(#glow)" />

  <!-- Top Badges -->
  <g transform="translate(48, 40)">
    <!-- WhatsApp Channel Tag -->
    <rect x="0" y="0" width="168" height="30" rx="15" fill="#064e3b" stroke="#059669" stroke-width="1.2" />
    <circle cx="16" cy="15" r="5" fill="#25D366" />
    <text x="28" y="19.5" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">META GRAPH API</text>

    <!-- Scale Tag -->
    <rect x="180" y="0" width="186" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="194" y="19.5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">2M-EMPLOYEE REACH</text>

    <!-- Privacy Tag -->
    <rect x="378" y="0" width="168" height="30" rx="15" fill="#14532d" stroke="#16a34a" stroke-width="1" opacity="0.9" />
    <text x="392" y="19.5" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">0 PII DATA EXPORTS</text>
  </g>

  <!-- Headline & Subtitle -->
  <text x="48" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    WhatsApp Campaign Manager
  </text>
  <text x="48" y="160" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    Native enterprise messaging architecture on Meta WhatsApp Business Platform
  </text>

  <!-- Central Visual: Pipeline & Live Console Mockup -->
  <g transform="translate(48, 190)">
    <!-- Container Card -->
    <rect x="0" y="0" width="704" height="210" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Card Header / Nav Bar -->
    <rect x="0" y="0" width="704" height="42" rx="16" fill="#0f172a" />
    <rect x="0" y="24" width="704" height="18" fill="#0f172a" />
    <line x1="0" y1="42" x2="704" y2="42" stroke="#1e293b" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="22" cy="21" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="38" cy="21" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="54" cy="21" r="5" fill="#10b981" opacity="0.8" />
    <text x="76" y="25" fill="#64748b" font-family="monospace" font-size="12">vc-production-campaign-manager / whatsapp-module</text>

    <!-- Meta Status Pill -->
    <g transform="translate(540, 10)">
      <rect x="0" y="0" width="144" height="22" rx="11" fill="#022c22" stroke="#059669" stroke-width="1" />
      <circle cx="12" cy="11" r="4" fill="#10b981" />
      <text x="24" y="15" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">META RATING: GREEN</text>
    </g>

    <!-- 3 Pipeline Pillars -->
    <!-- Pillar 1: Audience & Privacy -->
    <g transform="translate(24, 62)">
      <rect x="0" y="0" width="200" height="124" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.2" />
      <rect x="12" y="12" width="28" height="28" rx="6" fill="#064e3b" />
      <!-- Database Shield Icon -->
      <path d="M26 18c-3 0-6 1.5-6 4v6c0 4 6 7 6 7s6-3 6-7v-6c0-2.5-3-4-6-4z" fill="#34d399" />
      <text x="48" y="26" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">1. Production MySQL</text>
      <text x="48" y="38" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Saved SQL Audience</text>

      <text x="14" y="68" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">✓ Zero CSV / PII Export</text>
      <text x="14" y="88" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">✓ Live Resolve at Send</text>
      <text x="14" y="108" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">✓ Unique Key Guard</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M 234 124 L 246 124" stroke="#059669" stroke-width="2" stroke-dasharray="3,3" />
    <polygon points="248,124 242,120 242,128" fill="#059669" />

    <!-- Pillar 2: Meta Validation & Dispatch -->
    <g transform="translate(252, 62)">
      <rect x="0" y="0" width="200" height="124" rx="10" fill="#090d16" stroke="#047857" stroke-width="1.2" />
      <rect x="12" y="12" width="28" height="28" rx="6" fill="#064e3b" />
      <!-- Message / Bot Icon -->
      <path d="M18 20h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-10l-6 5v-5h-0a2 2 0 0 1-2-2V22a2 2 0 0 1 2-2z" fill="#10b981" />
      <text x="48" y="26" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">2. Meta Graph API</text>
      <text x="48" y="38" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10">Template & Send Logic</text>

      <text x="14" y="68" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">✓ Rule Validation Engine</text>
      <text x="14" y="88" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">✓ 30-Day Lock Prevention</text>
      <text x="14" y="108" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">✓ Jittered Backoff</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M 462 124 L 474 124" stroke="#059669" stroke-width="2" stroke-dasharray="3,3" />
    <polygon points="476,124 470,120 470,128" fill="#059669" />

    <!-- Pillar 3: Webhook Analytics & Rails -->
    <g transform="translate(480, 62)">
      <rect x="0" y="0" width="200" height="124" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.2" />
      <rect x="12" y="12" width="28" height="28" rx="6" fill="#064e3b" />
      <!-- Analytics Trend Icon -->
      <path d="M18 34l6-8 5 4 8-12" stroke="#34d399" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="48" y="26" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">3. HMAC Webhooks</text>
      <text x="48" y="38" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Real-Time Decisions</text>

      <text x="14" y="68" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">✓ Sent → Delivered → Read</text>
      <text x="14" y="88" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">✓ Error 131049 Decoded</text>
      <text x="14" y="108" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">✓ Automated STOP Opt-Out</text>
    </g>
  </g>
</svg>
