<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">WhatsApp Campaign Manager</title>
  <desc id="d">A campaign dashboard sends one WhatsApp message to many employees' phones, with delivery and read ticks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ECFDF3"/>
      <stop offset="1" stop-color="#D1FAE0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B3D2A" flood-opacity="0.15"/>
    </filter>
    <style>
      .sans  { font-family: 'Geist', 'Inter', 'Segoe UI', system-ui, sans-serif; }
      .title { font-size: 50px; font-weight: 800; fill: #0B2E21; letter-spacing: -1px; }
      .sub   { font-size: 22px; font-weight: 400; fill: #2F5E4B; }
      .pill  { font-size: 15px; font-weight: 600; fill: #0B6B3F; }
      .cardH { font-size: 15px; font-weight: 700; fill: #0B2E21; }
      .small { font-size: 12px; font-weight: 500; fill: #5B7F70; }
      .btn   { font-size: 14px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <circle cx="1180" cy="40" r="180" fill="#25D366" opacity="0.08"/>
  <circle cx="760" cy="420" r="140" fill="#25D366" opacity="0.07"/>
  <g class="sans">
    <g transform="translate(64 98)">
      <circle cx="30" cy="30" r="30" fill="#25D366"/>
      <path d="M8 60 L14 44 L26 54 Z" fill="#25D366"/>
      <path d="M19 22 h22 M19 30 h22 M19 38 h14" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="64" y="212" class="title">WhatsApp</text>
    <text x="64" y="266" class="title">Campaign Manager</text>
    <text x="66" y="308" class="sub">Create, send and track WhatsApp campaigns.</text>
  </g>
  <g class="sans" transform="translate(560 78)" filter="url(#shadow)">
    <rect width="250" height="244" rx="18" fill="#ffffff"/>
    <text x="20" y="34" class="cardH">📣 New campaign</text>
    <rect x="20" y="52" width="210" height="92" rx="12" fill="#DCF8C6"/>
    <rect x="34" y="68" width="150" height="9" rx="4.5" fill="#8BC79A"/>
    <rect x="34" y="86" width="176" height="9" rx="4.5" fill="#A9D9B3"/>
    <rect x="34" y="104" width="120" height="9" rx="4.5" fill="#A9D9B3"/>
    <rect x="34" y="122" width="80" height="9" rx="4.5" fill="#A9D9B3"/>
    <g transform="translate(20 162)">
      <circle cx="10" cy="10" r="10" fill="#94D3AC"/>
      <circle cx="26" cy="10" r="10" fill="#5FBF86" stroke="#fff" stroke-width="2"/>
      <circle cx="42" cy="10" r="10" fill="#25A85A" stroke="#fff" stroke-width="2"/>
      <text x="62" y="15" class="small">1,240 employees</text>
    </g>
    <rect x="20" y="196" width="210" height="34" rx="10" fill="#25D366"/>
    <text x="125" y="218" text-anchor="middle" class="btn">Send campaign ➤</text>
  </g>
  <g fill="none" stroke="#25D366" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round">
    <path d="M818 200 C 860 200, 870 120, 900 120"/>
    <path d="M818 200 H 1010"/>
    <path d="M818 200 C 880 200, 940 330, 1124 318"/>
  </g>
  <defs>
    <g id="phone">
      <rect width="96" height="176" rx="16" fill="#0B2E21"/>
      <rect x="6" y="6" width="84" height="164" rx="11" fill="#ECE5DD"/>
      <rect x="6" y="6" width="84" height="26" rx="11" fill="#128C7E"/>
      <rect x="6" y="20" width="84" height="12" fill="#128C7E"/>
      <circle cx="20" cy="19" r="6" fill="#ffffff" opacity="0.85"/>
      <rect x="31" y="16" width="36" height="6" rx="3" fill="#ffffff" opacity="0.85"/>
      <rect x="12" y="44" width="70" height="54" rx="8" fill="#ffffff"/>
      <rect x="19" y="53" width="52" height="6" rx="3" fill="#B9C9C2"/>
      <rect x="19" y="65" width="44" height="6" rx="3" fill="#D3DDD8"/>
      <rect x="19" y="77" width="36" height="6" rx="3" fill="#D3DDD8"/>
      <path d="M54 90 l3 3 l6 -6 M60 90 l3 3 l6 -6" fill="none" stroke="#34B7F1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <use href="#phone" transform="translate(900 36) scale(0.9)"/>
  <use href="#phone" transform="translate(1010 112)" filter="url(#shadow)"/>
  <use href="#phone" transform="translate(1124 188) scale(0.9)"/>
</svg>